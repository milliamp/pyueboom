name: Release

# Push a tag like v0.1.0 (matching __version__) to build and attach the
# wheel + sdist to a GitHub release. Home Assistant installs the wheel by URL.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check tag matches version
        run: |
          v=$(python -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('src/pyueboom/__init__.py').read())[1])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1; }
      - run: pip install build && python -m build
      - run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
